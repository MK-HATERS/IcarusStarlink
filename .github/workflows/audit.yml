name: Audit

# Complements ci.yml (build+test) with checks aimed at things a green build/test run doesn't
# catch: known-vulnerable dependencies, and secrets accidentally committed. Relevant here
# specifically because this app stores Nexus API keys and FTP site credentials (Secrets/
# Credential Manager integration) and ships a real auto-updater — both genuine security surface.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, since a package can go from "fine" to "newly disclosed CVE" with no code change here.
    - cron: "0 10 * * 1"
  workflow_dispatch:

# One run per branch at a time: a newer push to a pull request cancels the run it replaces,
# while runs on master always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-audit:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # NuGet's own restore-time audit (direct and transitive packages), with any advisory turned
      # into an error. Unlike "dotnet list package --vulnerable", it honours the reviewed
      # NuGetAuditSuppress entries in Directory.Build.props, so only those exact advisories pass.
      - name: Check for vulnerable packages
        run: dotnet restore IcarusStarlink.slnx --force -p:NuGetAudit=true -p:NuGetAuditMode=all -p:WarningsAsErrors="NU1901%3BNU1902%3BNU1903%3BNU1904"

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: |
          dotnet restore IcarusStarlink.slnx
          dotnet build IcarusStarlink.slnx --configuration Release --no-restore

      - uses: github/codeql-action/analyze@v4
