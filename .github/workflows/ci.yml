name: CI

# A WPF app only builds/runs on Windows, so this always runs on windows-latest, unlike most .NET
# CI templates which default to ubuntu-latest.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time: a newer push to a pull request cancels the run it replaces;
# on master the running one finishes and only the newest waiting push runs after it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # global.json holds the lowest SDK to use, with rollForward latestFeature: setup-dotnet then
      # installs the newest 10.0 SDK, the same rule a local build follows with what is installed.
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore IcarusStarlink.slnx

      - name: Build
        run: dotnet build IcarusStarlink.slnx --configuration Release --no-restore

      # A test that hangs (an awaited task that never completes) is stopped after 5 minutes and
      # named in the log, instead of holding the runner until the job's timeout. The GitHubActions
      # logger (GitHubActionsTestLogger, tests/Directory.Build.props) puts failed tests on the
      # run's page as annotations and in the job summary.
      - name: Test
        run: dotnet test IcarusStarlink.slnx --configuration Release --no-build --blame-hang-timeout 5m --blame-hang-dump-type none --logger "trx;LogFileName=test-results.trx" --logger GitHubActions

      # Always runs (even after a test failure) so a failed run's own results are still
      # inspectable from the workflow's own Summary/Artifacts tab, not just the raw console log.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 14

  # The release files only exist after a publish: the single-file IcarusStarlink.exe, the Native
  # AOT updater beside it, Uninstall.bat and 8 native DLLs, 11 files in all (README, Building).
  # Checked on every push to master and kept as that commit's build. Packaging a release (zip,
  # release.json, GitHub release) stays a separate manual step. UnrealPak.exe is never part of
  # this output: the app fetches it itself (UnrealPakInstaller.cs).
  publish-check:
    if: github.event_name != 'pull_request'
    needs: build-and-test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The updater's Native AOT link runs Visual Studio's vcvarsall, which calls vswhere.exe
      # from PATH.
      - name: Put vswhere on PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"

      - name: Publish
        run: dotnet publish src/IcarusStarlink.App/IcarusStarlink.App.csproj -c Release -r win-x64 --self-contained true -o out/IcarusStarlink

      - name: Check the release files
        shell: pwsh
        run: |
          $dir = (Resolve-Path 'out/IcarusStarlink').Path
          $expected = 'IcarusStarlink.exe', 'IcarusStarlink.Updater.exe', 'Uninstall.bat',
            'blake3_dotnet.dll', 'D3DCompiler_47_cor3.dll', 'e_sqlite3.dll', 'libSkiaSharp.dll',
            'PenImc_cor3.dll', 'PresentationNative_cor3.dll', 'vcruntime140_cor3.dll', 'wpfgfx_cor3.dll'
          $actual = @(Get-ChildItem -LiteralPath $dir -Recurse -Force | ForEach-Object { $_.FullName.Substring($dir.Length + 1) })
          $diff = Compare-Object -ReferenceObject $expected -DifferenceObject $actual
          if ($diff) {
            $diff | ForEach-Object { Write-Host "$($_.SideIndicator) $($_.InputObject)" }
            throw "The publish output isn't the 11 release files (=> extra, <= missing)."
          }
          $updater = Get-Item -LiteralPath (Join-Path $dir 'IcarusStarlink.Updater.exe')
          $updaterMb = [math]::Round($updater.Length / 1MB, 1)
          if ($updater.Length -gt 5MB) { throw "IcarusStarlink.Updater.exe is $updaterMb MB: not the Native AOT build (about 2 MB)." }
          $version = (dotnet msbuild src/IcarusStarlink.App/IcarusStarlink.App.csproj -nologo -getProperty:Version | Select-Object -Last 1).Trim()
          $product = (Get-Item -LiteralPath (Join-Path $dir 'IcarusStarlink.exe')).VersionInfo.ProductVersion
          if ($product -ne $version) { throw "IcarusStarlink.exe says $product; the csproj says $version." }
          $alone = Join-Path $env:RUNNER_TEMP 'IcarusStarlink.Updater.exe'
          Copy-Item -LiteralPath $updater.FullName -Destination $alone
          & $alone 2>$null
          if ($LASTEXITCODE -ne 2) { throw "The updater run on its own exited $LASTEXITCODE; expected 2 (its usage line)." }
          Write-Host "Release files OK: 11 files, updater $updaterMb MB, version $version."
          exit 0

      - name: Upload the release files
        uses: actions/upload-artifact@v6
        with:
          name: IcarusStarlink-${{ github.sha }}
          path: out/IcarusStarlink/
          retention-days: 7
